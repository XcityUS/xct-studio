name = "xcity-media"
main = "index.js"
compatibility_date = "2026-07-26"

# Custom domain: BytePlus/Ark's image fetcher cannot download from
# *.workers.dev (commonly blocklisted as an abuse domain), which broke every
# image-to-video request with "resource download failed". media.xcity.ai is
# served by this same worker; wrangler creates the DNS record on deploy
# (xcity.ai's zone lives in this Cloudflare account). Set the studio's
# MEDIA_WORKER_URL to https://media.xcity.ai so new upload/asset URLs use it.
routes = [
  { pattern = "media.xcity.ai", custom_domain = true }
]

# Generated videos live here permanently. Ark's own CDN links expire after
# 24h, so anything the studio should still play tomorrow gets copied in.
[[r2_buckets]]
binding = "XCITY_MEDIA"
bucket_name = "xcity-media"

[vars]
# Callers authenticate with their TokenHub virtual key; the worker verifies it
# against the gateway before accepting an upload, so this endpoint cannot be
# used as free storage by anonymous callers.
LITELLM_BASE_URL = "https://tokenhub.xcity.one"
# Comma-separated exact origins allowed to call /archive from a browser.
ALLOWED_ORIGINS = "https://studio.xcity.ai,https://chat.xcity.ai,https://xcity.ai"
STUDIO_URL = "https://studio.xcity.ai"
ADMIN_USER_IDS = ""
# Refuse to copy anything larger than this (bytes). 12s of 1080p Seedance is
# well under 100 MB; the cap is a runaway guard, not a product limit.
MAX_BYTES = "209715200"
# Cap for POST /upload reference images (bytes). 10 MB.
MAX_UPLOAD_BYTES = "10485760"
